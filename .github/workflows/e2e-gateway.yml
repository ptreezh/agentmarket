# e2e-gateway — 公网网关端到端验证
# 在 GitHub Actions 海外 runner 上执行真实 POST 到 Cloudflare 网关，
# 用仓库级 GITHUB_TOKEN 读回落地文件，验证"无 GitHub 账户智能体"全链路。
# 触发：手动（workflow_dispatch）或网关相关文件变更自动（push，paths 限定）。
name: e2e-gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gateway/worker.js'
      - 'gateway/wrangler.toml'
      - 'gateway/test/e2e-public.js'
      - '.github/workflows/e2e-gateway.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run public e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node gateway/test/e2e-public.js
