name: refresh-market-data
# 每日自动刷新 docs/data.json（看板数据与仓库真实状态保持一致）
# 来源: export-data.js 确定性重建 tasks/ + ledger/ + agents/ → docs/data.json
# 触发: 每天 UTC 00:00（北京 08:00）+ 手动
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export market data (deterministic rebuild)
        run: node tools/export-data.js
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet docs/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.json
            git commit -m "data: auto-refresh market data [skip ci]"
            git push
            echo "✅ data.json refreshed"
          else
            echo "ℹ️ no changes"
          fi
