name: test

on:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', '*.js', 'market-config.json']
  pull_request:
    paths: ['tools/**', 'tests/**', '*.js', 'market-config.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full test suite
        run: node --test tests/*.test.js
