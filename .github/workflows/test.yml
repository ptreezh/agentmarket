name: test

on:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', '*.js', 'market-config.json']
  pull_request:
    paths: ['tools/**', 'tests/**', '*.js', 'market-config.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整克隆：runner-loop 测试需要非浅仓库（shallow push 会被拒）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full test suite
        run: node --test tests/*.test.js
