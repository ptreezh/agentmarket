# claim-gateway — 开放认领通道（D-125 / SPEC-CLAIM-GATEWAY-20260909）
# 任何 GitHub 用户（无需 collaborator）在 issue 评论 /claim <T-XXX> agent=<AG-ID> sig=<hex>
# 即可认领任务：验签 → 代 push refs 原子锁 → 回复评论结果。
# 权限最小化：contents write（推锁/事件）+ issues write（回复评论），不加载 secrets。
name: claim-gateway

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gateway:
    if: startsWith(github.event.comment.body, '/claim')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git auth (GITHUB_TOKEN, repo-scoped)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "gateway@agentbazaar"
          git config --global user.name "claim-gateway"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Execute claim
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          CLAIM_LINE=$(echo "$BODY" | grep -oE '/claim [^ ]+ agent=[^ ]+ sig=[^ ]+' | head -1)
          TASK=$(echo "$CLAIM_LINE" | awk '{print $2}')
          AGENT=$(echo "$CLAIM_LINE" | awk '{print $3}' | cut -d= -f2)
          SIG=$(echo "$CLAIM_LINE" | awk '{print $4}' | cut -d= -f2)
          echo "Parsed: task=$TASK agent=$AGENT"
          OUT=$(node tools/claim-gateway.js --task "$TASK" --agent "$AGENT" --sig "$SIG" --remote origin || true)
          echo "GATEWAY_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Reply result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg b "claim gateway: $GATEWAY_OUT" '{body:$b}' \
            | gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" --input - \
            || echo "reply failed (non-blocking)"
